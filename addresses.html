<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Addresses | Customer Dashboard</title>
  <meta name="description" content="Manage your delivery addresses for fast biryani ordering and takeaway.">
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/sweetalert2.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Modern Dashboard Top Navigation -->
  <header class="dashboard-topbar py-2 py-md-3">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2 gap-sm-3">
        <!-- Mobile Sidebar Toggle -->
        <button class="btn btn-sm btn-outline-royal d-md-none d-flex align-items-center gap-1.5 rounded-pill px-2.5 py-1.5" type="button" data-bs-toggle="offcanvas" data-bs-target="#dashboardSidebar" aria-controls="dashboardSidebar" title="Open Dashboard Menu">
          <i class="bi bi-list fs-4"></i>
          <span class="small fw-bold">Menu</span>
        </button>

        <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
          <img src="assets/images/icons/logo.svg" alt="Zaffran Royal Biryani" class="brand-logo-img" style="height: 42px;">
        </a>
        <span class="badge bg-light text-primary border border-primary-subtle d-none d-sm-inline-flex align-items-center gap-1 px-2.5 py-1.5 rounded-pill font-heading">
          <i class="bi bi-shield-check text-warning"></i> Customer Portal
        </span>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="nav-action-btn theme-toggle-btn" type="button" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>

        <button class="nav-action-btn rtl-toggle-btn" type="button" title="Toggle RTL / LTR" aria-label="Toggle RTL Mode">
          <span class="small fw-bold">RTL</span>
        </button>

        <div class="dropdown">
          <button class="btn btn-sm p-1 rounded-circle border dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="assets/images/chefs/chef-1.jpg" alt="User Avatar" class="rounded-circle dash-header-avatar" style="width: 32px; height: 32px; object-fit: cover;">
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3">
            <li><h6 class="dropdown-header font-heading dash-user-name">Jero Khan</h6></li>
            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
            <li><a class="dropdown-item" href="my-orders.html"><i class="bi bi-bag-check me-2"></i>My Orders</a></li>
            <li><a class="dropdown-item" href="addresses.html"><i class="bi bi-geo me-2"></i>Saved Addresses</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="Auth.logout()"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>


  <!-- Dashboard Main Layout -->
  <main class="dashboard-layout">
    <div class="container">
      <div class="row g-4">
        <!-- Sidebar Column -->
        <div class="col-lg-3 col-md-4">
          <div class="offcanvas-md offcanvas-start dashboard-sidebar" id="dashboardSidebar" tabindex="-1" aria-labelledby="dashboardSidebarLabel"></div>
        </div>

        <!-- Main Content Column -->
        <div class="col-lg-9 col-md-8">
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
              <h3 class="font-heading text-primary mb-1">Saved Delivery Addresses</h3>
              <p class="small text-muted mb-0">Manage home, office, and party destinations for express checkout.</p>
            </div>
            <button class="btn btn-royal btn-sm" data-bs-toggle="modal" data-bs-target="#addAddressModal">
              <i class="bi bi-plus-lg me-1"></i> Add New Address
            </button>
          </div>

          <!-- Address Cards Grid -->
          <div class="row g-4" id="addressListContainer">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Add New Address Modal -->
  <div class="modal fade" id="addAddressModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title font-heading text-primary">Add Delivery Address</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addAddressForm">
          <div class="modal-body">
            <div class="mb-3">
              <label for="addrType" class="form-label">Address Label / Type</label>
              <select id="addrType" class="form-select">
                <option value="Home" selected>Home</option>
                <option value="Office">Office / Workplace</option>
                <option value="Other">Other / Villa</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="addrName" class="form-label">Contact Person Name</label>
              <input type="text" id="addrName" class="form-control" placeholder="e.g. Jero Khan" required>
            </div>
            <div class="mb-3">
              <label for="addrPhone" class="form-label">Contact Mobile Number</label>
              <input type="tel" id="addrPhone" class="form-control" placeholder="10-digit mobile" required>
            </div>
            <div class="mb-3">
              <label for="addrLine" class="form-label">Street Address &amp; House No.</label>
              <textarea id="addrLine" class="form-control" rows="2" placeholder="e.g. Villa 14, Royal Palms, Road 36, Jubilee Hills" required></textarea>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="addrCity" class="form-label">City</label>
                <input type="text" id="addrCity" class="form-control" value="Hyderabad" required>
              </div>
              <div class="col-6">
                <label for="addrPincode" class="form-label">Pincode</label>
                <input type="text" id="addrPincode" class="form-control" value="500033" required>
              </div>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="addrDefault" checked>
              <label class="form-check-label small" for="addrDefault">
                Set as default delivery address
              </label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-royal btn-sm">Save Address</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/sweetalert2.all.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/menu.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/orders.js"></script>
  <script src="assets/js/dashboard.js"></script>

  <script>
    function renderAddressesPage() {
      const container = document.getElementById('addressListContainer');
      if (!container) return;

      const addrs = Dashboard.getAddresses();

      if (addrs.length === 0) {
        container.innerHTML = `
          <div class="col-12">
            <div class="card border-0 shadow-sm rounded-4 p-5 text-center bg-white">
              <i class="bi bi-geo-alt display-4 text-muted mb-3 d-block"></i>
              <h4 class="font-heading text-primary">No Addresses Saved</h4>
              <p class="text-muted mb-3">Add your home or office address for fast delivery checkout.</p>
              <div>
                <button class="btn btn-royal btn-sm" data-bs-toggle="modal" data-bs-target="#addAddressModal">
                  Add Address Now
                </button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = addrs.map(a => `
        <div class="col-md-6">
          <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100 position-relative ${a.isDefault ? 'border border-2 border-warning' : ''}">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="badge ${a.type === 'Home' ? 'badge-maroon' : 'badge-gold'}">${a.type}</span>
              ${a.isDefault ? '<span class="badge bg-success-subtle text-success small fw-bold"><i class="bi bi-check-circle me-1"></i> Default</span>' : ''}
            </div>
            <h6 class="font-heading mb-1 text-primary">${a.name}</h6>
            <p class="small text-muted mb-2"><i class="bi bi-telephone text-secondary me-1"></i> ${a.phone}</p>
            <p class="small text-muted mb-4">${a.address}, ${a.city} - ${a.pincode}</p>
            <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
              ${!a.isDefault ? `
                <button class="btn btn-sm btn-link text-primary p-0 text-decoration-none fw-semibold" onclick="setDefaultAddress('${a.id}')">
                  Set as Default
                </button>
              ` : '<span></span>'}
              <button class="btn btn-sm text-danger p-0" onclick="deleteAddress('${a.id}')" title="Delete Address">
                <i class="bi bi-trash3"></i> Delete
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setDefaultAddress(id) {
      let addrs = Dashboard.getAddresses();
      addrs.forEach(a => a.isDefault = (a.id === id));
      Dashboard.saveAddresses(addrs);
      Validation.toast('Default address updated!', 'success');
      renderAddressesPage();
    }

    function deleteAddress(id) {
      let addrs = Dashboard.getAddresses();
      addrs = addrs.filter(a => a.id !== id);
      Dashboard.saveAddresses(addrs);
      Validation.toast('Address removed.', 'info');
      renderAddressesPage();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAddressesPage();
    });
  </script>
</body>
</html>
