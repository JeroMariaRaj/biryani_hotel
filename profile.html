<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Customer Dashboard</title>
  <meta name="description" content="Manage your customer account profile, contact information, avatar, and password.">
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/sweetalert2.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Modern Dashboard Top Navigation -->
  <header class="dashboard-topbar py-2 py-md-3">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2 gap-sm-3">
        <!-- Mobile Sidebar Toggle -->
        <button class="btn btn-sm btn-outline-royal d-md-none d-flex align-items-center gap-1.5 rounded-pill px-2.5 py-1.5" type="button" data-bs-toggle="offcanvas" data-bs-target="#dashboardSidebar" aria-controls="dashboardSidebar" title="Open Dashboard Menu">
          <i class="bi bi-list fs-4"></i>
          <span class="small fw-bold">Menu</span>
        </button>

        <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
          <img src="assets/images/icons/logo.svg" alt="Zaffran Royal Biryani" class="brand-logo-img" style="height: 42px;">
        </a>
        <span class="badge bg-light text-primary border border-primary-subtle d-none d-sm-inline-flex align-items-center gap-1 px-2.5 py-1.5 rounded-pill font-heading">
          <i class="bi bi-shield-check text-warning"></i> Customer Portal
        </span>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="nav-action-btn theme-toggle-btn" type="button" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>

        <button class="nav-action-btn rtl-toggle-btn" type="button" title="Toggle RTL / LTR" aria-label="Toggle RTL Mode">
          <span class="small fw-bold">RTL</span>
        </button>

        <div class="dropdown">
          <button class="btn btn-sm p-1 rounded-circle border dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="assets/images/chefs/chef-1.jpg" alt="User Avatar" class="rounded-circle dash-header-avatar" style="width: 32px; height: 32px; object-fit: cover;">
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3">
            <li><h6 class="dropdown-header font-heading dash-user-name">Jero Khan</h6></li>
            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
            <li><a class="dropdown-item" href="my-orders.html"><i class="bi bi-bag-check me-2"></i>My Orders</a></li>
            <li><a class="dropdown-item" href="addresses.html"><i class="bi bi-geo me-2"></i>Saved Addresses</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="Auth.logout()"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>


  <!-- Dashboard Main Layout -->
  <main class="dashboard-layout">
    <div class="container">
      <div class="row g-4">
        <!-- Sidebar Column -->
        <div class="col-lg-3 col-md-4">
          <div class="offcanvas-md offcanvas-start dashboard-sidebar" id="dashboardSidebar" tabindex="-1" aria-labelledby="dashboardSidebarLabel"></div>
        </div>

        <!-- Main Content Column -->
        <div class="col-lg-9 col-md-8">
          <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <h3 class="font-heading text-primary mb-1">My Profile Settings</h3>
            <p class="small text-muted mb-4">Update your contact details, delivery preferences, and security password.</p>

            <form id="profileForm" novalidate>
              <!-- Avatar Selector -->
              <div class="mb-4">
                <label class="form-label d-block">Choose Royal Avatar</label>
                <div class="d-flex align-items-center gap-3 profile-avatar-selector">
                  <img id="avatarPreview" src="assets/images/chefs/chef-1.jpg" alt="Avatar Preview" class="rounded-circle" style="width: 72px; height: 72px; object-fit: cover; border: 3px solid var(--secondary);">
                  <div class="d-flex gap-2 profile-avatar-options">
                    <button type="button" class="btn btn-sm btn-outline-royal" onclick="setAvatar('assets/images/chefs/chef-1.jpg')">Avatar 1</button>
                    <button type="button" class="btn btn-sm btn-outline-royal" onclick="setAvatar('assets/images/chefs/chef-2.jpg')">Avatar 2</button>
                    <button type="button" class="btn btn-sm btn-outline-royal" onclick="setAvatar('assets/images/chefs/chef-3.jpg')">Avatar 3</button>
                  </div>
                </div>
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="profileName" class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="profileName" required>
                </div>

                <div class="col-md-6">
                  <label for="profileEmail" class="form-label">Email Address</label>
                  <input type="email" class="form-control" id="profileEmail" required>
                </div>

                <div class="col-md-6">
                  <label for="profilePhone" class="form-label">Mobile Number</label>
                  <input type="tel" class="form-control" id="profilePhone" required>
                </div>

                <div class="col-md-6">
                  <label for="profileMemberTier" class="form-label">Membership Tier</label>
                  <input type="text" class="form-control bg-light" id="profileMemberTier" value="Royal Patron (Gold Tier)" readonly>
                </div>

                <!-- Password Change Section -->
                <div class="col-12 mt-4 pt-3 border-top">
                  <h5 class="font-heading text-primary mb-2">Change Password</h5>
                  <p class="small text-muted mb-3">Leave blank if you do not wish to update your password.</p>
                </div>

                <div class="col-md-6">
                  <label for="profilePassword" class="form-label">New Password</label>
                  <input type="password" class="form-control" id="profilePassword" placeholder="Minimum 6 characters">
                </div>

                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-royal py-2 px-4">
                    <i class="bi bi-check2-circle me-1"></i> Save Profile Changes
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/sweetalert2.all.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/menu.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/orders.js"></script>
  <script src="assets/js/dashboard.js"></script>

  <script>
    let currentAvatarUrl = 'assets/images/chefs/chef-1.jpg';

    function setAvatar(url) {
      currentAvatarUrl = url;
      document.getElementById('avatarPreview').src = url;
      const u = Auth.getCurrentUser();
      if (u) {
        u.avatar = url;
        let users = Auth.getUsers();
        users = users.map(user => user.id === u.id ? u : user);
        localStorage.setItem(Auth.USERS_KEY, JSON.stringify(users));
        Auth.loginUser(u, false);
        Dashboard.renderSidebar();
        Validation.toast('Avatar updated!', 'success');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const u = Auth.getCurrentUser();
      if (u) {
        document.getElementById('profileName').value = u.name;
        document.getElementById('profileEmail').value = u.email;
        document.getElementById('profilePhone').value = u.mobile;
        if (u.avatar) {
          document.getElementById('avatarPreview').src = u.avatar;
          currentAvatarUrl = u.avatar;
        }
      }
    });
  </script>
</body>
</html>
