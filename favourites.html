<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favourite Dishes | Customer Dashboard</title>
  <meta name="description" content="View and order your saved favourite biryanis, starters, and royal desserts.">
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/sweetalert2.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Modern Dashboard Top Navigation -->
  <header class="dashboard-topbar py-2 py-md-3">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2 gap-sm-3">
        <!-- Mobile Sidebar Toggle -->
        <button class="btn btn-sm btn-outline-royal d-md-none d-flex align-items-center gap-1.5 rounded-pill px-2.5 py-1.5" type="button" data-bs-toggle="offcanvas" data-bs-target="#dashboardSidebar" aria-controls="dashboardSidebar" title="Open Dashboard Menu">
          <i class="bi bi-list fs-4"></i>
          <span class="small fw-bold">Menu</span>
        </button>

        <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
          <img src="assets/images/icons/logo.svg" alt="Zaffran Royal Biryani" class="brand-logo-img" style="height: 42px;">
        </a>
        <span class="badge bg-light text-primary border border-primary-subtle d-none d-sm-inline-flex align-items-center gap-1 px-2.5 py-1.5 rounded-pill font-heading">
          <i class="bi bi-shield-check text-warning"></i> Customer Portal
        </span>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="nav-action-btn theme-toggle-btn" type="button" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>

        <button class="nav-action-btn rtl-toggle-btn" type="button" title="Toggle RTL / LTR" aria-label="Toggle RTL Mode">
          <span class="small fw-bold">RTL</span>
        </button>

        <div class="dropdown">
          <button class="btn btn-sm p-1 rounded-circle border dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="assets/images/chefs/chef-1.jpg" alt="User Avatar" class="rounded-circle dash-header-avatar" style="width: 32px; height: 32px; object-fit: cover;">
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3">
            <li><h6 class="dropdown-header font-heading dash-user-name">Jero Khan</h6></li>
            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
            <li><a class="dropdown-item" href="my-orders.html"><i class="bi bi-bag-check me-2"></i>My Orders</a></li>
            <li><a class="dropdown-item" href="addresses.html"><i class="bi bi-geo me-2"></i>Saved Addresses</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="Auth.logout()"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>


  <!-- Dashboard Main Layout -->
  <main class="dashboard-layout">
    <div class="container">
      <div class="row g-4">
        <!-- Sidebar Column -->
        <div class="col-lg-3 col-md-4">
          <div class="offcanvas-md offcanvas-start dashboard-sidebar" id="dashboardSidebar" tabindex="-1" aria-labelledby="dashboardSidebarLabel"></div>
        </div>

        <!-- Main Content Column -->
        <div class="col-lg-9 col-md-8">
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
              <h3 class="font-heading text-primary mb-1">Favourite Delicacies</h3>
              <p class="small text-muted mb-0">Dishes you have saved for one-click reordering.</p>
            </div>
            <a href="menu.html" class="btn btn-outline-royal btn-sm">
              <i class="bi bi-plus-circle me-1"></i> Browse More Dishes
            </a>
          </div>

          <!-- Favourites Container -->
          <div class="row g-4" id="favouritesContainer">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/sweetalert2.all.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/menu.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/orders.js"></script>
  <script src="assets/js/dashboard.js"></script>

  <script>
    function renderFavouritesPage() {
      const container = document.getElementById('favouritesContainer');
      if (!container) return;

      const favIds = Menu.getFavourites();

      if (favIds.length === 0) {
        container.innerHTML = `
          <div class="col-12">
            <div class="card border-0 shadow-sm rounded-4 p-5 text-center bg-white">
              <i class="bi bi-heart display-4 text-muted mb-3 d-block"></i>
              <h4 class="font-heading text-primary">No Favourites Saved Yet</h4>
              <p class="text-muted mb-4">Click the heart icon on any biryani, starter, or dessert card to save it here.</p>
              <div>
                <a href="menu.html" class="btn btn-royal">Browse Our Menu</a>
              </div>
            </div>
          </div>
        `;
        return;
      }

      const favDishes = favIds.map(id => Menu.getDishById(id)).filter(d => Boolean(d));

      container.innerHTML = favDishes.map(dish => `
        <div class="col-lg-6 col-md-12">
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white h-100">
            <div class="row g-0 h-100">
              <div class="col-5 position-relative">
                <img src="${dish.image}" alt="${dish.name}" class="w-100 h-100" style="object-fit: cover; min-height: 160px;">
                </div>
              <div class="col-7 p-3 d-flex flex-column justify-content-between">
                <div>
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="badge bg-light text-muted small">${dish.categoryName}</span>
                    <button class="btn btn-sm text-danger p-0" onclick="Menu.toggleFavourite('${dish.id}')" title="Remove from favourites">
                      <i class="bi bi-heart-fill"></i>
                    </button>
                  </div>
                  <h6 class="font-heading mb-1 text-dark">${dish.name}</h6>
                  <p class="small text-muted mb-2 text-truncate-2">${dish.description}</p>
                </div>
                <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                  <span class="fs-5 fw-bold text-primary font-heading">₹${dish.price}</span>
                  <button class="btn btn-sm btn-royal" onclick="Cart.add('${dish.id}')">
                    <i class="bi bi-cart-plus me-1"></i> Add
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Seed 2 favourites if completely empty initially
      if (Menu.getFavourites().length === 0) {
        localStorage.setItem(Menu.FAVOURITES_KEY, JSON.stringify(['dish-1', 'dish-4', 'dish-18']));
      }
      renderFavouritesPage();
    });
  </script>
</body>
</html>
