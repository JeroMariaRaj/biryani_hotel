<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#D99A32" />
      <stop offset="100%" stop-color="#A26B14" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F2530" />
      <stop offset="100%" stop-color="#58141A" />
    </linearGradient>
  </defs>

  <!-- Crown / Deg Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer ornate shield -->
    <path d="M30 2 C44 2 56 12 56 26 C56 46 30 58 30 58 C30 58 4 46 4 26 C4 12 16 2 30 2 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Dum Handi Pot Icon -->
    <path d="M18 25 C18 20 42 20 42 25 L45 38 C45 44 15 44 15 38 Z" fill="url(#goldGrad)"/>
    <!-- Lid and knob -->
    <ellipse cx="30" cy="24" rx="13" ry="3.5" fill="#FFF8EF"/>
    <circle cx="30" cy="20" r="2.5" fill="url(#goldGrad)"/>
    <!-- Steam Swirls -->
    <path d="M26 16 C25 13 28 11 27 8" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M33 16 C34 13 32 11 33 8" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Little stars -->
    <polygon points="30,48 31.5,52 35.5,52 32.5,54.5 33.5,58.5 30,56 26.5,58.5 27.5,54.5 24.5,52 28.5,52" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <text x="80" y="38" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="800" letter-spacing="2" fill="#741C24" class="brand-title">ZAFFRAN</text>
  <text x="82" y="54" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="3.5" fill="#D99A32" class="brand-subtitle">ROYAL BIRYANI &amp; TAKEAWAY</text>
  <text x="82" y="65" font-family="'DM Sans', sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.5" fill="#766B63" class="brand-meta">ESTD. 1984 • DUM COOKED TRADITION</text>
</svg>
