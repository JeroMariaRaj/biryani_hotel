<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Zaffran Royal Biryani</title>
  <meta name="description" content="Simulate password recovery for your Zaffran customer account.">
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/sweetalert2.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-warm d-flex flex-column min-vh-100 position-relative">

  <!-- Top Right Theme & RTL Controls (Desktop & Mobile) -->
  <div class="position-absolute top-0 end-0 p-3 p-md-4 d-flex align-items-center gap-2 z-3">
    <button class="nav-action-btn theme-toggle-btn" type="button" title="Toggle Theme" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
    <button class="nav-action-btn rtl-toggle-btn" type="button" title="Toggle RTL" aria-label="Toggle RTL">
      <span class="small fw-bold">RTL</span>
    </button>
  </div>

  <!-- Forgot Password Form Card -->
  <main class="flex-grow-1 d-flex flex-column justify-content-center py-5">
    <div class="container" style="max-width: 520px;">
      <div class="card auth-card border-0 rounded-4 overflow-hidden">
        <div class="p-4 p-md-5">

          <!-- Brand Logo & Title INSIDE Container -->
          <div class="text-center mb-4">
            <a href="index.html" class="d-inline-block mb-3" title="Zaffran Royal Biryani">
              <img src="assets/images/icons/logo.svg" alt="Zaffran Royal Biryani" class="brand-logo-img" style="height: 48px;">
            </a>
            <div>
              <span class="badge badge-gold mb-2">RECOVER ACCESS</span>
            </div>
            <h2 class="font-heading text-primary fw-bold mb-1">Reset Password</h2>
            <p class="small text-muted mb-0">Enter your registered email or mobile number to receive a simulated recovery token.</p>
          </div>

          <form id="forgotPassForm" novalidate>
            <div class="mb-4">
              <label for="recoveryInput" class="form-label">Email or 10-Digit Mobile <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="recoveryInput" placeholder="e.g. demo@zaffranbiryani.com" required>
              </div>
            </div>

            <button type="submit" class="btn btn-royal w-100 py-2.5 fs-6 fw-bold rounded-3">
              <i class="bi bi-send-check me-1"></i> Send Recovery Token (Demo)
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-0">
              Remembered your password? 
              <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign In Here</a>
            </p>
          </div>
        </div>
      </div>

      <!-- Mobile Theme & RTL Buttons (Under container in centre) -->
      <div class="d-flex d-md-none justify-content-center align-items-center gap-3 mt-4">
        <button class="nav-action-btn theme-toggle-btn" type="button" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <button class="nav-action-btn rtl-toggle-btn" type="button" title="Toggle RTL" aria-label="Toggle RTL">
          <span class="small fw-bold">RTL</span>
        </button>
      </div>

    </div>
  </main>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/sweetalert2.all.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgotPassForm');
      if (!form) return;

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('recoveryInput');
        if (!Validation.validateRequired(input.value)) {
          Validation.toast('Please enter your registered email or mobile.', 'error');
          return;
        }

        Swal.fire({
          title: 'Recovery Token Sent!',
          html: `A simulated password reset instructions link has been dispatched for <strong>${input.value}</strong>.<br><br><span class="small text-muted">You can proceed directly to sign in with your password.</span>`,
          icon: 'success',
          confirmButtonText: 'Proceed to Login',
          confirmButtonColor: '#741C24'
        }).then(() => {
          window.location.href = 'login.html';
        });
      });
    });
  </script>
</body>
</html>
